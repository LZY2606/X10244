[package]
name = "saxstation"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, buffer subtraction and multi-region model evidence station"

[lib]
name = "saxstation"
path = "src/lib.rs"

[[bin]]
name = "saxstation"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
