[package]
name = "saxs-bench"
version = "0.1.0"
edition = "2021"
description = "SAXS curve bench: normalization, background subtraction and multi-interval model evidence"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[profile.dev]
opt-level = 0
