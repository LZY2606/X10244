[package]
name = "saxs-provenance"
version = "0.1.0"
edition = "2021"
description = "SAXS 归一化、背景扣除与多区间模型证据台"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
