[package]
name = "saxs-workbench"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, background subtraction and multi-interval model evidence workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
