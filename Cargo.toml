[package]
name = "saxs-bench"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, background subtraction and multi-interval model evidence"

[lib]
name = "saxs_bench"
path = "src/lib.rs"

[[bin]]
name = "saxs-bench"
path = "src/main.rs"

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen_fixtures.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
sha2 = "0.10"
hex = "0.4"
rust-embed = "8"

[dev-dependencies]
tempfile = "3"
