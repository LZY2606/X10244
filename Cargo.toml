[package]
name = "saxs-station"
version = "0.1.0"
edition = "2021"
description = "散射曲线台：SAXS 归一化、背景扣除与多区间模型证据"

[[bin]]
name = "saxs-station"
path = "src/main.rs"

[lib]
name = "saxs_station"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
