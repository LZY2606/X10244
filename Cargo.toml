[package]
name = "saxs_scattering_bench"
version = "0.1.0"
edition = "2021"
description = "散射曲线台：SAXS 归一化、背景扣除与多区间模型证据"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[profile.dev]
opt-level = 0

[[bin]]
name = "saxs_scattering_bench"
path = "src/main.rs"
