[package]
name = "saxs_station"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, background subtraction and multi-region model evidence workbench"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "saxs_station"
path = "src/main.rs"

[profile.dev]
opt-level = 0
