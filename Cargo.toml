[package]
name = "saxs-station"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, buffer subtraction and multi-interval model evidence station"

[[bin]]
name = "saxs-station"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
