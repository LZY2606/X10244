[package]
name = "saxs-platform"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, buffer subtraction and multi-region model evidence platform"

[[bin]]
name = "saxs-platform"
path = "src/main.rs"

[lib]
name = "saxs_platform"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower = "0.4"

[dev-dependencies]
tempfile = "3"
