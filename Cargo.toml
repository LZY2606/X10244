[package]
name = "saxs-station"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, background subtraction and multi-interval model evidence station"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
