[package]
name = "saxs-desk"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, buffer subtraction and multi-range model evidence desk"

[lib]
name = "saxs_desk"
path = "src/lib.rs"

[[bin]]
name = "saxs-desk"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
