[package]
name = "saxs_bench"
version = "0.1.0"
edition = "2021"
description = "Scattering Curve Bench: SAXS normalization, background subtraction and multi-region model evidence"

[lib]
name = "saxs_bench"
path = "src/lib.rs"

[[bin]]
name = "saxs_bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
