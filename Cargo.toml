[package]
name = "saxs-station"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, buffer subtraction and multi-interval model evidence workbench"

[[bin]]
name = "saxs-station"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
