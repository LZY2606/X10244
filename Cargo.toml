[package]
name = "saxs-workbench"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, background subtraction and multi-interval model evidence workbench"

[[bin]]
name = "saxs-workbench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
serde_json = "1"
