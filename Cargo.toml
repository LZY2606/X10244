[package]
name = "saxs-station"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, buffer subtraction and multi-interval model evidence station"

[[bin]]
name = "saxs-station"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
tower = "0.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1.26", features = ["v4"] }
once_cell = "1"

[profile.test]
opt-level = 0
