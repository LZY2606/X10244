[package]
name = "saxs-bench"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, background subtraction and multi-interval model evidence bench"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "saxs_bench"
path = "src/lib.rs"

[[bin]]
name = "saxs-bench"
path = "src/main.rs"
