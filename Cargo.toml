[package]
name = "saxs-bench"
version = "0.1.0"
edition = "2021"
description = "散射曲线台: SAXS 归一化、背景扣除与多区间模型证据"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
