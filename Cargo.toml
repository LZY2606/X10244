[package]
name = "saxs-review-station"
version = "0.1.0"
edition = "2021"
description = "Offline SAXS normalization, background subtraction and multi-interval evidence review"

[dependencies]
axum = { version = "0.8.1", features = ["macros"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tempfile = "3.12"
