[package]
name = "saxs-bench"
version = "0.1.0"
edition = "2021"
description = "Scattering curve bench: SAXS normalization, background subtraction and multi-interval model evidence"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 1
