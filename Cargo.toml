[package]
name = "saxs-desk"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, background subtraction and multi-range model evidence desk"

[[bin]]
name = "saxs-desk"
path = "src/main.rs"

[[bin]]
name = "gen_case"
path = "src/bin/gen_case.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
anyhow = "1"

[dev-dependencies]
