[package]
name = "saxs_station"
version = "0.1.0"
edition = "2021"
description = "Scattering Curve Bench: SAXS normalization, background subtraction and multi-interval model evidence"

[lib]
name = "saxs_station"
path = "src/lib.rs"

[[bin]]
name = "saxs_station"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
