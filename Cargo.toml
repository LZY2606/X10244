[package]
name = "saxs-station"
version = "0.1.0"
edition = "2021"
description = "SAXS normalization, buffer subtraction and multi-interval model evidence station"

[[bin]]
name = "saxs-station"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
