[package]
name = "saxs-bench"
version = "0.1.0"
edition = "2021"
description = "散射曲线台：SAXS 归一化、背景扣除与多区间模型证据"

[[bin]]
name = "saxs-bench"
path = "src/main.rs"

[[bin]]
name = "make-fixtures"
path = "src/bin/make_fixtures.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
