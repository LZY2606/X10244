[package]
name = "saxs-bench"
version = "0.1.0"
edition = "2021"
description = "散射曲线台: SAXS 归一化、背景扣除与多区间模型证据 (offline, event-sourced)"

[lib]
name = "saxs_bench"
path = "src/lib.rs"

[[bin]]
name = "saxs-bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
