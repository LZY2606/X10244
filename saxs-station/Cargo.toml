[package]
name = "saxs-station"
version = "0.1.0"
edition = "2021"
description = "散射曲线台：SAXS 归一化、背景扣除与多区间模型证据（可审阅依赖链）"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"

[profile.test]
opt-level = 1
