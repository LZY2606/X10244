[package]
name = "saxs-station"
version = "0.1.0"
edition = "2021"

[lib]
name = "saxs_station"
path = "src/lib.rs"

[[bin]]
name = "saxs-station"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
